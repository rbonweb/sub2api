# Builds this fork's image and publishes it to GHCR as ghcr.io/rbonweb/sub2api, so a server can run the fork's main instead of weishaw/sub2api.
name: Fork image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image
  cancel-in-progress: true

jobs:
  image:
    if: github.repository == 'rbonweb/sub2api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            COMMIT=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          tags: |
            ghcr.io/rbonweb/sub2api:latest
            ghcr.io/rbonweb/sub2api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/rbonweb/sub2api
          cache-from: type=gha
          cache-to: type=gha,mode=max
